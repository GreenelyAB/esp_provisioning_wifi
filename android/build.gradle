group = "how.virc.flutter_esp_ble_prov"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // esp-idf-provisioning-android is published on JitPack only.
        maven { url = uri("https://jitpack.io") }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "how.virc.flutter_esp_ble_prov"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 23
        consumerProguardFiles("consumer-rules.pro")
    }
}

dependencies {
    implementation("com.github.espressif:esp-idf-provisioning-android:lib-2.4.4")
    // Declared by lib-2.4.4 as runtime-only; the plugin compiles against EventBus directly.
    // Versions match the library's own build.gradle at that tag.
    implementation("org.greenrobot:eventbus:3.3.1")
    implementation("com.google.crypto.tink:tink-android:1.12.0")
    implementation("com.google.protobuf:protobuf-javalite:3.18.0")
}
